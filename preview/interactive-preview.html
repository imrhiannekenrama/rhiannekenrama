<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhianne Ken S. Rama — Personal Website Preview</title>
<style>
:root{--bg:#090e1b;--panel:#121d32;--panel2:#1b2a46;--line:#2a3851;--text:#f0f5ff;--muted:#a4b3ce;--accent:#a8a9ff;--cyan:#73d7fb;--shadow:0 18px 60px #01081477}*{box-sizing:border-box}[hidden]{display:none!important}html{scroll-behavior:smooth}body{margin:0;background:#080d19;color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}h1,h2,h3,p{margin-top:0}h1,h2{letter-spacing:-.04em;line-height:1.14}h1{font-size:clamp(2.6rem,5.5vw,5.2rem)}h2{font-size:clamp(1.8rem,3vw,3rem)}h3{font-size:1.14rem}p{color:#a4b3ce}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.container{width:min(1120px,calc(100% - 44px));margin:auto}.small{font-size:.85rem}.eyebrow{font-size:.70rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}.muted{color:var(--muted)}.gradient-text{background:linear-gradient(105deg,#f9fbff 10%,#b9b6ff 55%,#74dcf2 95%);color:transparent;background-clip:text}.flex{display:flex;align-items:center;gap:12px}.space{display:flex;justify-content:space-between;align-items:center;gap:16px}.wrap{flex-wrap:wrap}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:linear-gradient(147deg,#162239,#0f192b);border:1px solid var(--line);border-radius:18px;padding:22px;color:var(--text)}.section{padding:66px 0}.section-heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:26px}.section-heading p{margin:0}.button,.button-outline,.button-ghost{min-height:42px;padding:10px 17px;display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;border-radius:11px;font-weight:700;font-size:.87rem;transition:.15s}.button:hover,.button-outline:hover,.button-ghost:hover{transform:translateY(-2px)}.button{background:#aca7ff;color:#101429}.button-outline{border-color:#425477;background:#1b2840;color:white}.button-ghost{background:transparent;color:#c9d4e9}.site-header{position:sticky;top:0;z-index:50;background:#090f1ded;backdrop-filter:blur(20px);border-bottom:1px solid #273551}.site-header-inner{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{display:inline-flex;align-items:center;gap:11px;font-weight:850;letter-spacing:.035em}.logo-mark{width:37px;height:37px;display:grid;place-items:center;border:1px solid #5d6aa2;border-radius:12px;background:#212a51;color:#b2b7ff;font-size:21px}.nav{display:flex;gap:22px;align-items:center}.nav button{border:0;background:none;color:#bfcce5;font-size:.87rem;padding:7px 0}.nav button:hover,.nav button.active{color:white}.mobile-menu{display:none}.hero{position:relative;overflow:hidden;padding:95px 0 83px;background:radial-gradient(ellipse at 80% 33%,#29316b7a 0,transparent 50%),radial-gradient(ellipse at 12% 90%,#15456c4a,transparent 48%)}.hero:before{content:'';position:absolute;inset:0;opacity:.13;background-image:radial-gradient(#dde6ff 1px,transparent 1px);background-size:45px 45px;pointer-events:none}.hero-inner{position:relative;display:grid;grid-template-columns:1.08fr .92fr;align-items:center;gap:45px}.hero h1{margin:22px 0}.hero p{font-size:1.05rem;max-width:590px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:27px 0}.hero-visual{background:#111f37bd;border:1px solid #42527a;border-radius:27px;padding:12px;box-shadow:var(--shadow)}.galaxy{position:relative;border:1px solid #374760;border-radius:21px;background:radial-gradient(ellipse at center,#1e2954 0%,#101a31 53%,#091325 95%);min-height:330px;display:grid;place-items:center;overflow:hidden}.galaxy svg{width:100%;height:auto;display:block}.world-node{cursor:pointer}.world-node:focus{outline:none}.world-node:hover circle:first-child{stroke-width:4}.world-card{position:relative;min-height:185px;padding:23px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;text-align:left;cursor:pointer}.world-card:after{content:'';position:absolute;width:175px;height:175px;border-radius:50%;background:var(--w);opacity:.055;right:-40px;top:-62px}.world-icon{width:45px;height:45px;display:grid;place-items:center;border-radius:14px;background:#2b3a58;color:var(--w);font-size:22px}.world-card h3{margin:16px 0 4px}.world-card p{font-size:.86rem;margin:0}.world-card .arrow{color:var(--w);position:absolute;right:22px;bottom:23px}.page-head{padding:63px 0 37px;background:radial-gradient(ellipse at 55% -20%,#37377488,transparent 55%);border-bottom:1px solid #1f2b40}.page-head h1{font-size:clamp(2.2rem,5vw,4.3rem);margin:11px 0}.page-head p{font-size:1.04rem;max-width:760px}.footer{border-top:1px solid #2b3956;background:#0b1221;padding:28px 0;margin-top:50px}.tag{font-size:.7rem;text-transform:uppercase;letter-spacing:.075em;font-weight:700;color:#b3bcfb;background:#262e4b;border:1px solid #495477;border-radius:99px;padding:4px 9px;display:inline-flex;align-items:center;gap:6px}.empty{text-align:center;padding:53px 24px;border:1px dashed #475979;border-radius:17px;background:#131e32}.empty .empty-icon{font-size:34px;color:#9fafff}.pill{background:#1b2841;border:1px solid #344661;border-radius:99px;padding:8px 14px;color:#c7d4e9;cursor:pointer}.pill.active{border-color:#a9acff;background:#30385f;color:white}.studio-layout{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:700px}.studio-sidebar{border-right:1px solid #2b3853;background:#101a2b;padding:27px 13px}.studio-sidebar button{display:flex;gap:11px;align-items:center;width:100%;background:none;color:#bac9e0;border:0;border-radius:9px;padding:12px 15px;text-align:left;font-size:.88rem}.studio-sidebar button:hover,.studio-sidebar button.sel{background:#23314d;color:white}.studio-main{padding:34px min(3vw,38px);min-width:0}.stat-value{font-size:2.35rem;font-weight:800;line-height:1.25;margin-top:8px}.input,textarea,select{background:#0e1829;border:1px solid #40506d;border-radius:10px;color:#f5f8ff;min-height:43px;padding:11px 12px;width:100%}textarea{min-height:120px;resize:vertical}.field{display:flex;flex-direction:column;gap:7px;margin:0 0 16px}.field label{font-size:.83rem;font-weight:750;color:#d6e0f4}.editor-grid{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:20px}.editor-block{background:#1b2a44;border:1px solid #354664;padding:14px;border-radius:12px;margin:11px 0}.notice{padding:12px 14px;border:1px solid #50688c;border-radius:10px;background:#1b2e4b;color:#e0eaff}.reading{background:#eeeae3;color:#1b2635;border-radius:16px;padding:32px}.reading p{color:#364358}.studio-link{border:1px solid #425477;background:#1b2840;color:white;border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}.switchbar{background:#111b2e;border-bottom:1px solid #2a3851;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.switchbar button{border:1px solid #344766;background:#1c2a43;color:#d5def4;border-radius:9px;padding:7px 13px}.switchbar button.active{background:#aba9ff;color:#0d1424;font-weight:750}.site-frame{max-width:100%;margin:auto;transition:width .24s}.site-frame.mobile{width:390px;max-width:100%;border-left:1px solid #344462;border-right:1px solid #344462;box-shadow:0 0 70px #0009}.badge{font-size:.73rem;border:1px solid #314666;color:#c8d5ea;border-radius:99px;padding:4px 8px}.iconbtn{background:transparent;border:0;color:#cbd6ef;padding:8px;cursor:pointer}.focus-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.mini-stat{font-size:.75rem;color:#a9b8d0;letter-spacing:.07em;text-transform:uppercase}.hscroll{overflow:auto}.alert{background:#1a2d44;border:1px solid #3b5572;border-radius:11px;padding:13px;color:#cbd9ed;font-size:.86rem}.mobile .hero-inner,.mobile .two,.mobile .three,.mobile .four,.mobile .editor-grid{grid-template-columns:1fr}.mobile .hero{padding:53px 0}.mobile .hero h1{font-size:2.65rem}.mobile .section{padding:44px 0}.mobile .container{width:calc(100% - 28px)}.mobile .nav{display:none}.mobile .mobile-menu{display:inline-flex}.mobile .site-header-inner{height:64px}.mobile .hero-visual{max-width:100%}.mobile .studio-layout{grid-template-columns:1fr}.mobile .studio-sidebar{display:flex;overflow-x:auto;gap:3px;padding:9px}.mobile .studio-sidebar button{white-space:nowrap;width:auto;padding:9px 13px}.mobile .studio-main{padding:20px 15px}.mobile .section-heading{flex-direction:column;align-items:flex-start}.mobile .focus-list{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile .card{padding:17px}.mobile .page-head{padding:40px 0}.mobile .page-head h1{font-size:2.3rem}.mobile .galaxy{min-height:230px}
@media(max-width:900px){.nav{gap:10px}.nav button{font-size:.79rem}.hero-inner{gap:23px}.studio-layout{grid-template-columns:205px 1fr}}

/* Personal identity and portrait */
.logo-mark{font-size:.75rem}.site-header .nav{gap:clamp(9px,1.1vw,17px)}
.hero{padding:80px 0 56px}.hero-inner{grid-template-columns:1.1fr .9fr;gap:55px}
.hero h1{font-size:clamp(2.6rem,5.4vw,4.8rem)}.hero-visual.portrait-hero{padding:11px;max-width:470px;margin-left:auto}
.portrait-shell{background:linear-gradient(140deg,#23345e,#111b31);padding:10px;border-radius:24px;border:1px solid #546388;box-shadow:0 19px 60px #0308129e;width:100%}
.portrait-window{width:100%;aspect-ratio:4/4.3;border:1px solid #435675;border-radius:18px;overflow:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;background:radial-gradient(circle at 44% 25%,#5263a555,transparent 50%),linear-gradient(140deg,#29385f,#111c32)}
.portrait-initials{width:130px;height:130px;display:grid;place-items:center;border:2px solid #aaa9ff9c;border-radius:50%;font-size:3.3rem;font-weight:900;letter-spacing:-.1em;color:#e9eaff;box-shadow:0 0 70px #8984d861}.portrait-label{font-size:.8rem;color:#c8d4ee}.portrait-bottom{padding:13px 7px 5px;display:flex;align-items:center;gap:9px;font-size:.91rem}.online-dot{background:#65d6aa;width:8px;height:8px;border-radius:50%}.portrait-sub{color:#9cafcc;font-size:.6rem;letter-spacing:.1em;margin-left:auto}
.quick-nav{background:#152138;border:1px solid #3d4e70;border-radius:16px;position:relative;margin-top:-23px;padding:19px 22px;box-shadow:0 20px 50px #050d2059}.quick-nav-links{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:10px}.quick-nav-link{padding:14px 7px;color:#f0f5ff;background:#22314b;border:1px solid #435578;border-radius:10px;font-weight:750}.quick-nav-link:hover{background:#334666}.quick-nav-link span{color:#bbb7ff;margin-right:5px}
.mobile .hero-inner{grid-template-columns:1fr}.mobile .hero-visual.portrait-hero{margin:auto}.mobile .quick-nav{margin-top:10px}.mobile .quick-nav-links{grid-template-columns:repeat(2,1fr)}

</style></head><body><div class="switchbar"><div class="flex wrap"><strong style="letter-spacing:.07em;color:#ecefff">RR  ·  Rhianne Ken S. Rama</strong><span class="badge">VISUAL PREVIEW • DEMO DATA</span></div><div class="flex wrap"><button id="desktop" class="active" onclick="device('desktop')">▣ Desktop</button><button id="mobile" onclick="device('mobile')">▯ Mobile</button><button onclick="view('home')">↶ Home</button></div></div><div class="site-frame" id="site"><div id="app"></div></div>
<script>
let previewPhoto='',page='home',mode='desktop',selected=0,menu=false,demoContent=null,editorType='journal',editPreview=false,notice='',studioTab='overview';
const worlds=[{name:'Books & Writings',key:'books',icon:'▤',c:'#f7cc78',desc:'Books, essays, and the stories you write.'},{name:'Research Lab',key:'research',icon:'⚗',c:'#73d3fa',desc:'Investigations, academic work, and discoveries.'},{name:'Memory Vault',key:'memories',icon:'▧',c:'#f19ac1',desc:'Photos, milestones, and chapters of your life.'},{name:'Learning',key:'learning',icon:'▱',c:'#76e7b2',desc:'Courses, certifications, and new skills.'},{name:'Life Journal',key:'journal',icon:'✎',c:'#bba8ff',desc:'Personal updates, thoughts, and reflections.'},{name:'Creation Studio',key:'projects',icon:'◇',c:'#fda8a0',desc:'Things you build, test, and create.'},{name:'Mind Garden',key:'ideas',icon:'✧',c:'#91a4ff',desc:'Growing thoughts and unexplored ideas.'},{name:'Milestones',key:'achievements',icon:'✷',c:'#fed28c',desc:'Accomplishments and defining moments.'}];
const coords=[[188,93],[525,86],[620,255],[475,395],[225,393],[75,258],[350,38],[358,464]];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function device(which){mode=which;document.getElementById('site').className='site-frame '+(which==='mobile'?'mobile':'');document.getElementById('desktop').className=which==='desktop'?'active':'';document.getElementById('mobile').className=which==='mobile'?'active':'';render()}
function view(which){page=which;menu=false;notice='';render();window.scrollTo({top:0,behavior:'instant'})}
function gallery(compact){const ws=worlds.map((w,i)=>{let [x,y]=coords[i];return `<g class="world-node" tabindex="0" role="button" aria-label="Select ${w.name}" onclick="choose(${i})" onkeydown="if(event.key==='Enter')choose(${i})"><circle cx="${x}" cy="${y}" r="${selected===i?40:36}" fill="${selected===i?'#2d4062':'#1e2942'}" stroke="${w.c}" stroke-width="${selected===i?3:1.4}"/><circle cx="${x}" cy="${y}" r="12" fill="${w.c}"/><text x="${x}" y="${y+57}" font-size="12" text-anchor="middle" fill="${selected===i?'white':'#afbed5'}">${w.name.replace(' & Writings','')}</text></g>`}).join('');return `<div class="galaxy"><svg viewBox="0 0 700 510" role="img" aria-label="Interactive constellation map"><defs><radialGradient id="core"><stop stop-color="#7a7cef" stop-opacity=".65"/><stop offset="1" stop-color="#293263" stop-opacity="0"/></radialGradient></defs>${coords.map(([x,y],i)=>`<line x1="350" y1="255" x2="${x}" y2="${y}" stroke="${worlds[i].c}" stroke-opacity=".33" stroke-dasharray="5 7"/>`).join('')}<circle cx="350" cy="255" r="103" fill="url(#core)"/><circle cx="350" cy="255" r="53" fill="#2b3a69" stroke="#b7b7ff" stroke-width="2"/><text x="350" y="263" text-anchor="middle" fill="white" font-weight="800" font-size="20">YOU</text>${ws}</svg></div>`}
function choose(i){selected=i;if(page==='home')view('explore');else render()}
function header(){const n=[['home','Home'],['about','About'],['books','Books'],['research','Research'],['memories','Photos'],['journal','Updates'],['explore','Explore']];const more=[['learning','Courses'],['projects','Projects'],['timeline','Timeline'],['ideas','Ideas'],['achievements','Achievements'],['search','Search']];return `<header class="site-header"><div class="container site-header-inner"><button class="logo iconbtn" style="padding:0;font-size:1rem" onclick="view('home')"><span class="logo-mark" style="font-size:.75rem;font-weight:900">RR</span><span>Rhianne Ken S. Rama</span></button><nav class="nav">${n.map(([k,t])=>`<button class="${page===k?'active':''}" onclick="view('${k}')">${t}</button>`).join('')}<button aria-label="Open more sections" onclick="menu=!menu;render()">More ▾</button><button aria-label="Search" onclick="view('search')">⌕</button><button aria-label="Owner sign in" onclick="view('login')">♙</button></nav><button class="mobile-menu iconbtn" aria-label="Open navigation" onclick="menu=!menu;render()">☰</button></div>${menu?`<div class="container" style="padding-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px">${[...n,...more,['login','Owner Sign In'],['studio','Studio Preview']].map(([k,t])=>`<button class="studio-link" onclick="menu=false;view('${k}')">${t}</button>`).join('')}</div>`:''}</header>`}
function portrait(){return `<div class="portrait-shell"><div class="portrait-window">${previewPhoto?`<img alt="Preview portrait of Rhianne Ken S. Rama" src="${previewPhoto}" style="height:100%;width:100%;object-fit:cover">`:`<div class="portrait-initials">RR</div><div class="portrait-label">▧ &nbsp; Your portrait goes here</div>`}</div><div class="portrait-bottom"><span class="online-dot"></span><b>Rhianne Ken S. Rama</b><span class="portrait-sub">PERSONAL WEBSITE</span></div></div>`}
function selectPreviewPhoto(input){const f=input.files&&input.files[0];if(!f)return;if(!f.type.startsWith('image/')){alert('Choose an image file.');return;}const reader=new FileReader();reader.onload=()=>{previewPhoto=String(reader.result);view('home')};reader.readAsDataURL(f)}
function footer(){return `<footer class="footer"><div class="container space wrap"><div><strong>Rhianne Ken S. Rama</strong><p class="small" style="margin:4px 0">A digital universe, always evolving.</p></div><div class="flex wrap"><button class="iconbtn" onclick="view('about')">About</button><button class="iconbtn" onclick="view('search')">Search</button><button class="iconbtn" onclick="view('login')">Owner</button></div></div></footer>`}
function worldCards(){return worlds.map((w,i)=>`<button class="card world-card" style="--w:${w.c}" onclick="choose(${i})"><span class="world-icon">${w.icon}</span><div><h3>${w.name}</h3><p>${w.desc}</p></div><span class="arrow">↗</span></button>`).join('')}
function home(){return `<section class="hero"><div class="container hero-inner"><div><div class="eyebrow">✧ &nbsp; Welcome to my personal website</div><h1>Hi, I'm <span class="gradient-text">Rhianne Ken S. Rama.</span></h1><p>Welcome to my personal space. Explore my books, research, learning journey, photographs, projects, and the stories that shape who I am.</p><div class="hero-actions"><button class="button" onclick="view('about')">Get to know me →</button><button class="button-outline" onclick="view('explore')">Explore my work ↗</button></div><div class="flex muted small"><span style="color:#aaa5ff">✧</span> A personal space for everything I write, learn and create.</div></div><div class="hero-visual portrait-hero">${portrait()}</div></div></section><div class="container quick-nav"><span class="eyebrow">FIND YOUR WAY AROUND</span><div class="quick-nav-links">${[['books','▤','Books'],['research','⚗','Research'],['memories','▧','Photos'],['learning','▱','Courses'],['journal','✎','Life Updates']].map(([k,ic,t])=>`<button class="quick-nav-link" onclick="view('${k}')"><span>${ic}</span> ${t} ↗</button>`).join('')}</div></div><section class="section container"><div class="section-heading"><div><div class="eyebrow">WHAT INTERESTS YOU?</div><h2 style="margin:7px 0">Explore my world.</h2><p>Find my writing, life moments, academic work, and things I'm learning.</p></div><button class="button-outline" onclick="view('explore')">Visual explorer ↗</button></div><div class="grid four">${worldCards()}</div></section><section class="section container"><div class="section-heading"><div><div class="eyebrow">LATEST FROM ME</div><h2>New chapters will appear here.</h2><p>My updates, research, books and experiences will be shown here as I publish them.</p></div></div>${demoContent&&demoContent.status==='published'&&demoContent.visibility==='public'?`<button class="card" style="text-align:left" onclick="view('sample')"><span class="tag">${esc(demoContent.type)}</span><h3>${esc(demoContent.title)}</h3><p>${esc(demoContent.summary)}</p>Read entry →</button>`:`<div class="empty"><div class="empty-icon">✎</div><h3>My story starts here.</h3><p>No public posts yet. I'll be adding my work and life updates.</p></div>`}</section>`}
function explore(){let w=worlds[selected];return `<section class="page-head"><div class="container"><div class="eyebrow">YOUR DIGITAL UNIVERSE</div><h1>Explore the worlds.</h1><p>Select a world, then enter to explore the parts of your life you choose to publish.</p></div></section><section class="section container" style="padding-top:30px"><div class="space wrap" style="margin-bottom:15px"><p style="margin:0">Select a world, then enter to explore its published content.</p><button class="button-outline" onclick="document.getElementById('list').hidden=!document.getElementById('list').hidden">List view ⇄</button></div><div id="list" hidden class="grid two" style="margin-bottom:18px">${worlds.map((w,i)=>`<button class="studio-link" onclick="choose(${i})">${w.name} ↗</button>`).join('')}</div>${gallery()}<div class="card space wrap" style="margin-top:18px"><div><div class="eyebrow">SELECTED DESTINATION</div><h3 style="margin:7px 0">${w.name}</h3><p style="margin:0">${w.desc}</p></div><div class="flex wrap"><button class="button-ghost" onclick="choose(0)">↺ Reset</button><button class="button" onclick="view('${w.key}')">Enter World ↗</button></div></div></section>`}
function collection(name){let w=worlds.find(x=>x.key===name);if(!w){w={name:'Search the Universe',desc:'Search every published entry across your archive.',c:'#bba8ff'}}return `<section class="page-head"><div class="container"><div class="eyebrow">Rhianne Ken S. Rama / ${esc(name).toUpperCase()}</div><h1>${w.name}</h1><p>${w.desc}</p></div></section><section class="section container"><div class="space wrap" style="margin-bottom:22px"><div><h2 style="font-size:1.7rem;margin:0 0 4px">Explore the archive</h2><p>Public content is shown here as you publish it.</p></div><button class="button-outline" onclick="view('explore')">Back to Universe ↗</button></div>${demoContent&&demoContent.status==='published'&&demoContent.visibility==='public'&&demoContent.type===name?`<div class="grid three"><button class="card" style="text-align:left" onclick="view('sample')"><span class="tag">${esc(name)}</span><h3 style="margin-top:15px">${esc(demoContent.title)}</h3><p>${esc(demoContent.summary)}</p>Read entry →</button></div>`:`<div class="empty"><div class="empty-icon">◇</div><h3>Nothing published in this collection yet.</h3><p>Once you publish your ${w.name.toLowerCase()}, they will automatically appear here.</p><button class="button-outline" onclick="view('studio')">Preview Creator Studio →</button></div>`}</section>`}
function signin(){return `<section class="page-head"><div class="container"><div class="eyebrow">OWNER AUTHENTICATION</div><h1>A universe only you can edit.</h1><p>The real site uses a single provisioned owner account and secure Supabase authentication with MFA.</p></div></section><section class="section container" style="max-width:650px"><div class="card"><div class="eyebrow">OWNER ACCESS / DESIGN PREVIEW</div><h2 style="font-size:1.9rem;margin-top:10px">Sign in to Creator Studio</h2><div class="field"><label>Owner email</label><input class="input" placeholder="you@example.com" disabled></div><div class="field"><label>Password or passkey</label><input class="input" placeholder="••••••••••" type="password" disabled></div><div class="alert" style="margin-bottom:17px">This is a visual prototype. Never type your real password here. Authentication is not active in the preview.</div><button class="button" onclick="view('studio')">Open Studio Demo →</button><button class="button-ghost" onclick="view('home')">Return to Website</button></div></section>`}
const smenu=[['overview','◫','Dashboard'],['content','▤','Content Library'],['media','▧','Media Vault'],['design','◈','Site Designer'],['connections','⌘','Connections'],['publishing','◷','Publishing'],['analytics','▥','Analytics'],['inbox','✉','Inbox'],['settings','⚙','Settings']];
function sidebar(){return `<aside class="studio-sidebar"><div class="eyebrow" style="padding:0 15px;margin-bottom:15px">OWNER CONTROL CENTER</div><button style="background:#323763;color:white;margin-bottom:12px" onclick="newEntry('journal')">⊕ &nbsp; New Content</button>${smenu.map(([k,ic,t])=>`<button class="${studioTab===k?'sel':''}" onclick="studioTab='${k}';render()"><span>${ic}</span> ${t}</button>`).join('')}<div style="height:1px;background:#2c3d57;margin:16px 0"></div><button onclick="view('home')">◉ &nbsp; View public site</button></aside>`}
function studio(){let cards=[['book','New Book','▤'],['research','Research','⚗'],['album','Photo Album','▧'],['journal','Journal Entry','✎'],['course','Course','▱'],['project','Project','◇']];let contents=studioTab==='overview'?`<div class="eyebrow">WELCOME BACK / CREATOR MODE</div><h1 style="font-size:2.7rem;margin:5px 0 10px">Your universe, your control.</h1><p>Manage every story, project, memory and part of your digital world from here.</p><div class="grid four" style="margin:26px 0 42px">${[['All Entries',demoContent?1:0],['Drafts',demoContent?.status==='draft'?1:0],['Published',demoContent?.status==='published'?1:0],['Unread Messages',0]].map(([l,n])=>`<div class="card"><div class="eyebrow">${l}</div><div class="stat-value">${n}</div></div>`).join('')}</div><div class="section-heading"><div><h2 style="font-size:1.9rem;margin-bottom:5px">Quick create</h2><p>What would you like to add to your universe?</p></div><button class="button-outline" onclick="studioTab='content';render()">Manage all entries ↗</button></div><div class="grid three">${cards.map(([k,t,ic])=>`<button class="card" style="display:flex;align-items:center;gap:13px;cursor:pointer;text-align:left" onclick="newEntry('${k}')"><span style="color:#b3afff;font-size:21px">${ic}</span><strong>${t}</strong><span style="margin-left:auto">↗</span></button>`).join('')}</div><div class="card" style="margin-top:25px;display:flex;flex-wrap:wrap;gap:20px;align-items:center"><div style="flex:1;min-width:200px"><span class="eyebrow">MY PROFILE PHOTO</span><h3>Put your photo on the homepage.</h3><p class="small">Try a photo in this preview. In your real website, upload through Studio → Settings and save your choice.</p><input id="photo-preview-input" aria-label="Choose preview portrait" type="file" accept="image/*" onchange="selectPreviewPhoto(this)" style="max-width:100%"></div><div style="max-width:140px;flex:0 0 120px">${portrait()}</div></div><h2 style="font-size:1.9rem;margin:42px 0 20px">Recent activity</h2>${demoContent?`<div class="card space wrap"><div><strong>${esc(demoContent.title)}</strong><div class="small muted">${esc(demoContent.type)} · ${demoContent.status}</div></div><button class="button-outline" onclick="editEntry()">Edit →</button></div>`:`<div class="empty"><div class="empty-icon">✎</div><h3>Your archive starts here.</h3><p>Create your first entry to begin documenting your life.</p><button class="button" onclick="newEntry('journal')">Create content</button></div>`}`:studioTab==='content'?`<div class="eyebrow">STUDIO / LIBRARY</div><h1 style="font-size:2.5rem">Content Library</h1><p>Manage all books, papers, courses, photographs, journals and custom records.</p><div class="space wrap" style="margin-bottom:20px"><button class="button" onclick="newEntry('journal')">+ New Content</button><span class="tag">${demoContent?1:0} DEMO ITEMS</span></div>${demoContent?`<div class="card space wrap"><div><strong>${esc(demoContent.title)}</strong><p style="margin:4px 0">${esc(demoContent.type)} · ${demoContent.status} · ${demoContent.visibility}</p></div><button class="button-outline" onclick="editEntry()">Edit →</button></div>`:`<div class="empty"><h3>No records yet</h3><p>Add your first item using the editor.</p></div>`}`:studioTab==='design'?`<div class="eyebrow">SITE DESIGNER</div><h1 style="font-size:2.5rem">Design Your Universe.</h1><p>Manage homepage sections, themes and selected appearance settings.</p><div class="grid two">${['Worlds','Recently Added','My Timeline','Feature Spotlight'].map((x,i)=>`<div class="card space"><div><strong>${x}</strong><p class="small" style="margin:0">${i===3?'Potential future module':'Homepage section'}</p></div><span class="tag">${i===3?'PLANNED':'VISIBLE'}</span></div>`).join('')}</div><div class="alert" style="margin-top:18px">Advanced drag-and-drop page building is planned for a later release.</div>`:`<div class="eyebrow">CREATOR STUDIO / ${studioTab.toUpperCase()}</div><h1 style="font-size:2.5rem">${smenu.find(x=>x[0]===studioTab)?.[2]}</h1><p>This module is included in the source project. Connect Supabase to use its live operations.</p><div class="empty"><div class="empty-icon">◇</div><h3>Your private workspace</h3><p>Content and settings will load from your real database once configured.</p></div>`;
return `${header()}<div class="studio-layout">${sidebar()}<main class="studio-main">${contents}</main></div>`}
function newEntry(type){editorType=type;notice='';editPreview=false;demoContent=null;page='editor';render()}
function editEntry(){editorType=demoContent?.type||'journal';notice='';editPreview=false;view('editor')}
function editor(){let d=demoContent||{title:'',summary:'',body:'',type:editorType,visibility:'private',tags:''};return `${header()}<div class="studio-layout">${sidebar()}<main class="studio-main"><div class="eyebrow">STUDIO / CONTENT EDITOR</div><div class="space wrap" style="margin-bottom:20px"><div><h1 style="font-size:2.25rem;margin:4px 0">${demoContent?'Edit Content':'New Content'}</h1><p>Keep your archive organized and your public universe alive.</p></div><div class="flex wrap"><button class="button-outline" onclick="togglePreview()">◉ Preview</button><button class="button-outline" onclick="saveEntry('draft')">Save Draft</button><button class="button" onclick="saveEntry('published')">Publish Now ↗</button></div></div>${notice?`<div class="notice" style="margin-bottom:14px">${esc(notice)}</div>`:''}${editPreview?`<div class="reading"><div class="eyebrow">DEMO READING PREVIEW</div><h1 style="font-size:2.3rem">${esc(d.title)||'Untitled'}</h1><p>${esc(d.summary)}</p><div style="white-space:pre-wrap;color:#334155">${esc(d.body)||'Your writing will appear here.'}</div></div>`:`<div class="editor-grid"><div><div class="card"><div class="field"><label>Title *</label><input id="entry-title" class="input" value="${esc(d.title)}" placeholder="Write a meaningful title"></div><div class="field"><label>Short description</label><textarea id="entry-summary" placeholder="Introduce this story, book, study or project">${esc(d.summary)}</textarea></div></div><div class="card" style="margin-top:18px"><h3>Content blocks</h3><div class="eyebrow" style="margin-bottom:10px">PARAGRAPH</div><textarea id="entry-body" placeholder="Write your story, research notes, or ideas here…" style="min-height:220px">${esc(d.body)}</textarea><div class="flex wrap" style="margin-top:14px"><span class="tag">+ paragraph</span><span class="tag">+ heading</span><span class="tag">+ image</span><span class="tag">+ quote</span><span class="tag">+ file</span></div></div></div><aside><div class="card"><h3>Content settings</h3><div class="field"><label>Content type</label><select id="entry-type">${['book','research','album','course','journal','project','idea','achievement','page'].map(k=>`<option value="${k}" ${d.type===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select id="entry-visibility">${[['private','Private — only you'],['unlisted','Unlisted — link only'],['public','Public — everyone']].map(([k,t])=>`<option value="${k}" ${d.visibility===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Tags</label><input class="input" id="entry-tags" value="${esc(d.tags)}" placeholder="life, research, books"></div><p class="small">Unlisted links can be forwarded. Private entries require authentication.</p><button class="button-outline" onclick="saveEntry('scheduled')">Schedule (demo)</button></div><div class="card" style="margin-top:15px"><h3>Cover media</h3><p class="small">Real uploads connect to protected Supabase Storage.</p><span class="tag">SUPABASE SETUP REQUIRED</span></div></aside></div>`}</main></div>`}
function collectEditor(){const title=document.getElementById('entry-title'),summary=document.getElementById('entry-summary'),body=document.getElementById('entry-body');if(!title)return;demoContent={title:title.value,summary:summary.value,body:body.value,type:document.getElementById('entry-type').value,visibility:document.getElementById('entry-visibility').value,tags:document.getElementById('entry-tags').value,status:demoContent?.status||'draft'};}
function togglePreview(){if(!editPreview)collectEditor();editPreview=!editPreview;render()}
function saveEntry(status){if(!editPreview)collectEditor();if(!demoContent?.title?.trim()){notice='Please enter a title before saving.';render();return}demoContent.status=status==='scheduled'?'scheduled':status;notice=status==='published'?'Publication simulated locally. This is NOT a live post.':status==='draft'?'Draft saved inside this preview session only.':'Scheduling previewed; no background task was created.';editPreview=false;render()}
function about(){return `<section class="page-head"><div class="container"><div class="eyebrow">ABOUT ME</div><h1>Meet Rhianne Ken S. Rama.</h1><p>Writer, researcher, lifelong learner — and everything in between.</p></div></section><section class="section container two grid"><div><div class="eyebrow">MY STORY</div><h2>Welcome to my corner of the internet.</h2><p>I'll share more about myself, my journey, my books, the research I've done and everything I'm learning. My full biography will be added soon.</p><button class="button" onclick="view('explore')">Explore my work ↗</button></div><div>${portrait()}</div></section>`}
function sample(){return `<section class="page-head"><div class="container"><div class="eyebrow">EXAMPLE CONTENT / NOT PUBLIC</div><h1>${esc(demoContent?.title)}</h1><p>${esc(demoContent?.summary)}</p></div></section><section class="section container"><div class="card" style="white-space:pre-wrap">${esc(demoContent?.body)}</div><p class="small" style="margin-top:20px">Simulated content lives only in this browser preview.</p></section>`}
function render(){document.getElementById('app').innerHTML=(page==='studio'?studio():page==='editor'?editor():header()+`<main id="main">${page==='home'?home():page==='explore'?explore():page==='login'?signin():page==='about'?about():page==='sample'?sample():page==='timeline'?collection('timeline'):page==='search'?collection('search'):collection(page)}</main>`+footer());}
render();
</script></body></html>
